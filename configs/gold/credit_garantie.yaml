# Modèle Gold — axe Crédit-Garantie (déclaratif).
# PILOTE : dim_temps + dim_produit + gdw_encours. On étend après validation métier.
database: gold_credit_garantie

targets:

  # ── Dimension date (générée) ──────────────────────────────
  - name: dim_temps
    type: date
    range: {from: "2020-01-01", to: "2030-12-31"}

  # ── Dimension produit (depuis Silver SCD2, état courant) ──
  - name: dim_produit
    type: dimension
    source: silver_credit_garantie.pops
    mode: scd2_current
    key: [idf_code_produit]
    columns:
      - idf_code_produit
      - cod_sop          # clé de jointure avec les faits : COD_PRODUIT (crédit) = COD_SOP
      - cod_activite
      - lib_activite
      - cod_famille
      - lib_famille
      - prod_commercial
      - lib_produit
      - cod_usage
      - cod_typ_produit

  # ── Dimension organisation (réseau agences, depuis ORG SCD2) ──
  # Jointure validée donnée : grc_portefeuille.idf_num_gui = org.idf_num_gui (100%)
  - name: dim_organisation
    type: dimension
    source: silver_credit_garantie.org
    mode: scd2_current
    key: [idf_num_gui, idf_num_bur]
    columns:
      - idf_num_gui
      - idf_num_bur
      - cod_fed
      - lib_fed_court
      - cod_bqe
      - lib_bqe
      - lib_typ_dir
      - num_dir
      - lib_dir_court
      - lib_typ_grp
      - num_grp
      - lib_grp_court
      - lib_court_gui
      - lib_long_gui
      - lib_bur
      - typ_bur
      - cod_ecv_bur
      - nom_vil_bur
      - code_post_bur
      - code_reg_eco

  # ── Fait encours (snapshot par date_arrete) ───────────────
  - name: gdw_encours
    type: fact
    source: silver_credit_garantie.credit_amort
    historisation: snapshot
    grain: [idf_num_doss, date_arrete]
    joins:
      # as-of : gèle le tiers tel qu'il était à l'arrêté (via le hub contrat)
      - with: silver_credit_garantie.image_contrat
        match: {num_compte_emprunteur: idf_ref_ext_ctr}
        as_of: date_arrete
        select: [idf_num_tiers]
    columns:
      - {src: idf_num_doss, role: pk}
      - {src: num_compte_emprunteur, role: fk, ref: bridge_image_contrat}
      - {src: idf_num_tiers, role: fk, ref: dim_tiers}
      - {src: cod_produit, role: fk, ref: dim_produit}
      - {src: date_accord, role: fk, ref: dim_temps}
      - {src: mnt_capital_rest_du, as: encours, role: measure}
      - {src: mnt_credit, role: measure}
      - {src: tx_credit, role: attribute}
      - {src: duree, role: attribute}
      - {src: cod_sit_doss, role: attribute}

  # ── Fait impayés (détail créance, snapshot) ───────────────
  - name: gdw_impayes
    type: fact
    source: silver_credit_garantie.impayes_cdl
    historisation: snapshot
    grain: [idf_num_dossier, idf_num_creance, date_arrete]
    columns:
      - {src: idf_num_dossier, as: idf_num_doss, role: fk, ref: gdw_encours}
      - {src: idf_num_creance, role: pk}
      - {src: num_compte, role: fk, ref: bridge_image_contrat}
      - {src: mnt_impayes_cdl, role: measure}
      - {src: mnt_creance, role: measure}
      - {src: cod_statut_incident, role: attribute}   # classe CDL (RB/IM/PD/DT/CP)
      - {src: date_mise_impaye, role: attribute}      # pour l'aging calendaire
      - {src: date_echeance, role: attribute}

  # ── OBT : synthèse crédit (agrégats 1:N + dims aplaties) ───
  - name: gdw_synthese_credit
    type: obt
    base: gdw_encours
    joins:
      # Jointure produit corrigée (2026-06-10) : COD_PRODUIT (crédit, code du système
      # opérant ex. CIM02) = POPS.COD_SOP — validé donnée réelle : 198981/200000 (99,5%).
      # L'hypothèse du diagramme (= IDF_CODE_PRODUIT, code activité) donnait 0 match.
      - with: dim_produit
        match: {cod_produit: cod_sop}
        select: [cod_famille, lib_famille]
    aggregates:
      - from: gdw_impayes
        group_by: [idf_num_doss, date_arrete]
        measures:
          mnt_impaye_total: "sum(mnt_impayes_cdl)"
          nb_creances_impayees: "count(*)"
    derived:
      # uniquement des BRIQUES (flags/compteurs) — les KPI ratios vivent dans la vue
      flag_cdl: "coalesce(nb_creances_impayees, 0) > 0"

  # ── Vue KPI (couche sémantique — rien n'est matérialisé) ──
  # Un nouveau KPI métier = une ligne ici, zéro re-run de données.
  - name: v_kpi_credit
    type: view
    base: gdw_synthese_credit
    select:
      taux_impaye: "coalesce(mnt_impaye_total, 0) / nullif(encours, 0)"
      poids_impaye_creance: "coalesce(mnt_impaye_total, 0) / nullif(mnt_credit, 0)"

  # ═══════════════════════════════════════════════════════════════════════════
  # EXTENSION dashboards (2026-06-18) — colonnes vérifiées sur le Silver.
  # Constellation : ces faits partagent les dimensions conformes existantes.
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Dimension tiers (clients) — depuis TIERS SCD2, état courant ───────────
  # NB segment fin (COD_MARCHE) = dans TYPOLOGIE ; build_dimension ne joint pas
  # encore → on porte cod_catg_jur (segment grossier) en attendant l'enrichissement.
  - name: dim_tiers
    type: dimension
    source: silver_credit_garantie.tiers
    mode: scd2_current
    key: [idf_num_tiers]
    columns:
      - idf_num_tiers
      - raison_sociale
      - nom_usg_tiers
      - prenom_tiers
      - cod_catg_jur        # segment grossier (PP / PM …)
      - cod_activite
      - cod_typ_tiers
      - cod_statut_tiers

  # ── Dimension pont portefeuille (tiers → agence) — pour « par agence » ────
  # Relie le tiers à son guichet/agence (idf_num_gui → dim_organisation).
  - name: dim_portefeuille
    type: dimension
    source: silver_credit_garantie.grc_portefeuille
    mode: scd2_current
    key: [idf_num_tiers]
    columns:
      - idf_num_tiers
      - idf_num_gui        # → dim_organisation[idf_num_gui]
      - idf_code_cc        # chargé de compte
      - cod_typ_rattach

  # ── Fait garanties (snapshot) ─────────────────────────────────────────────
  # ⚠️ garantie_contrat lie garantie↔crédit (M:N possible) → l'ajout du lien crédit
  # peut démultiplier les lignes : pour « valeur garanties » totale, agréger au grain
  # garantie (idf_num_ctr_garantie). Le lien sert pour couverture/par-produit.
  - name: fait_garanties
    type: fact
    source: silver_credit_garantie.garantie_detail
    historisation: snapshot
    grain: [idf_num_ctr_garantie, cod_typ_garant, date_arrete]
    joins:
      - with: silver_credit_garantie.garantie_contrat
        match: {idf_num_ctr_garantie: idf_num_ctr_garantie}
        select: [idf_ref_ext_credit]          # = credit_amort.idf_num_doss
    columns:
      - {src: idf_num_ctr_garantie, role: pk}
      - {src: idf_ref_ext_credit, role: fk, ref: gdw_encours}
      - {src: cod_typ_garant, role: attribute}      # type : hypothèque / caution / …
      - {src: cod_nat_garantie, role: attribute}
      - {src: cod_statut_garantie, role: attribute}
      - {src: mnt_total_garantie, role: measure}
      - {src: mnt_actualise, role: measure}
      - {src: pourcentage_garantie, role: attribute}

  # ── Fait autorisations (snapshot) ─────────────────────────────────────────
  # taux d'utilisation = montant_utilise / montant_autorise (même table, en MAD)
  - name: fait_autorisations
    type: fact
    source: silver_credit_garantie.idce_autorisation
    historisation: snapshot
    grain: [idf_ref_auto, num_compte, date_arrete]
    columns:
      - {src: idf_ref_auto, role: pk}
      - {src: num_compte, role: fk, ref: bridge_image_contrat}   # = idf_ref_ext_ctr
      - {src: num_tiers, role: fk, ref: dim_tiers}
      - {src: cod_typ_auto, role: attribute}
      - {src: cod_etat_auto, role: attribute}
      - {src: mnt_auto_tot_mad, as: montant_autorise, role: measure}
      - {src: mnt_auto_deb_mad, as: montant_utilise, role: measure}

  # ── Fait dépassements (snapshot) ──────────────────────────────────────────
  - name: fait_depassement
    type: fact
    source: silver_credit_garantie.depassement
    historisation: snapshot
    grain: [num_compte, date_entree, compte_general, date_arrete]
    columns:
      - {src: num_compte, role: fk, ref: bridge_image_contrat}
      - {src: compte_general, role: attribute}
      - {src: date_entree, role: attribute}
      - {src: date_sortie, role: attribute}
      - {src: mnt_depassement, role: measure}

globals:
  layer_abbrev: BR
  severity_weights:
    CRITICAL: 1
    HIGH: 2
    MEDIUM: 3
    LOW: 4
project:
  layer: BRONZE
  domain: CREDIT_GARANTIE
  environment: DEV
  execution_id_template: '{layer_abbrev}_{domain}_{table_name}_{timestamp}'
spark:
  configs:
  - key: spark.sql.extensions
    value: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
  - key: spark.sql.catalog.spark_catalog
    value: org.apache.iceberg.spark.SparkSessionCatalog
  - key: spark.sql.catalog.spark_catalog.type
    value: hive
  - key: spark.sql.catalog.spark_catalog.uri
    value: thrift://ubuntu3:9083
  - key: spark.sql.parquet.datetimeRebaseModeInWrite
    value: CORRECTED
  - key: spark.sql.parquet.int96RebaseModeInWrite
    value: CORRECTED
  - key: spark.sql.sources.partitionOverwriteMode
    value: DYNAMIC
output:
  database: silver_credit_garantie
  quality_results:
    name_template: '{layer_abbrev}_{domain}_QUALITY_RESULTS'
    format: iceberg
    mode: append
    partition_by:
    - environment
    - date_situation
  log_pipeline:
    name_template: '{layer_abbrev}_{domain}_LOG_PIPELINE'
    format: iceberg
    mode: append
    partition_by:
    - environment
performance:
  cache_source_data: true
  repartition:
    enabled: false
    num_partitions: 8
retry:
  max_retries: 3
  backoff_seconds: 2
  retryable_exceptions:
  - java.io.IOException
  - org.apache.spark.SparkException
  - java.net.ConnectException
execution:
  dry_run: false
  date_situation:
    source: today
    format: yyyy-MM-dd
tables:
- name: ASAL
  domain: asal
  primary_key:
  - IDF_PERSONNEL
  is_partitioned: false
  source:
    path_template: hdfs://ubuntu3:9000/data/landing/{table_name_lower}/date_arrete={date_arrete}
    format: parquet
    loading:
      mode: FULL
  schema:
    on_cast_error: reject
    fields:
    - name: IDF_PERSONNEL
      spark_type: StringType
      nullable: false
      description: Identifiant Personnel
    - name: COD_TITRE
      spark_type: StringType
      nullable: true
      description: Titre
    - name: NOM_PERSONNEL
      spark_type: StringType
      nullable: true
      description: NOM
    - name: PRN_PERSONNEL
      spark_type: StringType
      nullable: true
      description: PRENOM
    - name: ADR_EMAIL
      spark_type: StringType
      nullable: true
      description: Adresse Email
    - name: CODE_FEDERATION
      spark_type: StringType
      nullable: true
      description: Code Fédération
    - name: NUM_GUICHET
      spark_type: StringType
      nullable: true
      description: Numéro Guichet
    - name: NUM_BUREAU
      spark_type: StringType
      nullable: true
      description: Numéro Bureau
    - name: CODE_RATTACHEMENT
      spark_type: StringType
      nullable: true
      description: Code rattachement
    - name: MATRICULE
      spark_type: StringType
      nullable: true
      description: Matricule
    - name: COD_MRH
      spark_type: StringType
      nullable: true
      description: Code Métier RH
  write:
    format: parquet
    path_template: hdfs://ubuntu3:9000/data/bronze/{domain}/{table_name}/date_arrete={date_arrete}
    mode: overwrite
    partition_by:
    - date_arrete
    compression: snappy
    coalesce: 4
  silver_write:
    database: silver_credit_garantie
    table: asal
    mode: overwrite
    partition_by:
    - date_arrete
    deduplicate: true
  quality_rules:
  - field: IDF_PERSONNEL
    source_column: IDF_PERSONNEL
    data_type: StringType
    description: PK IDF_PERSONNEL — clé primaire
    checks:
    - type: not_null
      severity: CRITICAL
      alert_threshold: 0.0
      control_type: BASIC
    - type: unique
      severity: CRITICAL
      alert_threshold: 0.0
      control_type: BASIC
  - field: COD_TITRE
    source_column: COD_TITRE
    data_type: StringType
    description: COD_TITRE — codification EDD
    checks:
    - type: not_null   # flag 'manquant' — distinct du in_list (ajouté 2026-05-31)
      severity: MEDIUM
      alert_threshold: 0.0
      control_type: BASIC
      informational: true   # systématique sur colonne optionnelle → hors statut ligne
    - type: in_list
      severity: HIGH
      allowed_values:
      - M
      - MELLE
      - Melle
      - Mme
      - Mr
      alert_threshold: 1.0
      control_type: BASIC
  consistency_rules: []

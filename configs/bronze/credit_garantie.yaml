    condition: "COD_TYP_TIERS = 'PM'"
    required_fields:
    - RAISON_SOCIALE
    severity: HIGH
    alert_threshold: 5.0
    control_type: ADVANCED
- name: CONTACTS
  domain: contacts
  primary_key: &id017
  - IDF_NUM_TIERS
  - IDF_INDIC_LIGNE
  - IDF_NUM_TEL
  is_partitioned: false
  source:
    path_template: hdfs://ubuntu3:9000/data/landing/{table_name_lower}/date_arrete={date_arrete}
    format: parquet
    loading:
      mode: FULL
  schema:
    on_cast_error: reject
    fields:
    - name: IDF_NUM_TIERS
      spark_type: DecimalType(13, 0)
      nullable: false
      description: Référence tiers
    - name: IDF_INDIC_LIGNE
      spark_type: StringType
      nullable: false
      description: Indicatif  de la ligne
    - name: IDF_NUM_TEL
      spark_type: StringType
      nullable: false
      description: Numéro Téléphone
    - name: IVN_LOG
      spark_type: StringType
      nullable: true
      description: Intervenant logique
    - name: COD_MOD_MAJ
      spark_type: StringType
      nullable: true
      description: Mode de mise à Jour
    - name: DATE_MODIF
      spark_type: StringType
      nullable: true
      description: Date de modification (mise en place) de l’enregistrement
    - name: ADR_MAIL_SG_SOC
      spark_type: StringType
      nullable: true
      description: Adresse Mail Siège Sociale (site web)
    - name: COD_USG_LIGNE
      spark_type: StringType
      nullable: true
      description: Usage de la ligne
    - name: COD_TYP_MATERIEL
      spark_type: StringType
      nullable: true
      description: Type de matériel
  write:
    format: parquet
    path_template: hdfs://ubuntu3:9000/data/bronze/{domain}/{table_name}/date_arrete={date_arrete}
    mode: overwrite
    partition_by:
    - date_arrete
    compression: snappy
    coalesce: 4
  silver_write:
    database: silver_credit_garantie
    table: contacts
    mode: overwrite
    partition_by:
    - date_arrete
  quality_rules:
  - field: IDF_NUM_TIERS
    source_column: IDF_NUM_TIERS
    data_type: StringType
    description: PK IDF_NUM_TIERS — clé primaire
    checks:
    - type: not_null
      severity: CRITICAL
      alert_threshold: 0.0
      control_type: BASIC
  - field: IDF_INDIC_LIGNE
    source_column: IDF_INDIC_LIGNE
    data_type: StringType
    description: PK IDF_INDIC_LIGNE — clé primaire
    checks:
    - type: not_null
      severity: CRITICAL
      alert_threshold: 0.0
      control_type: BASIC
  - field: IDF_NUM_TEL
    source_column: IDF_NUM_TEL
    data_type: StringType
    description: PK IDF_NUM_TEL — clé primaire
    checks:
    - type: not_null
      severity: CRITICAL
      alert_threshold: 0.0
      control_type: BASIC
  - field: COD_MOD_MAJ
    source_column: COD_MOD_MAJ
    data_type: StringType
    description: COD_MOD_MAJ — codification EDD
    checks:
    - type: in_list
      severity: HIGH
      allowed_values:
      - B
      - M
      - T
      - TP
      alert_threshold: 1.0
      control_type: BASIC
  - field: COD_TYP_MATERIEL
    source_column: COD_TYP_MATERIEL
    data_type: StringType
    description: COD_TYP_MATERIEL — codification EDD
    checks:
    - type: in_list
      severity: HIGH
      allowed_values:
      - A
      - F
      - I
      - T
      - W
      - X
      - Y
      alert_threshold: 1.0
      control_type: BASIC
  - field: COD_USG_LIGNE
    source_column: COD_USG_LIGNE
    data_type: StringType
    description: COD_USG_LIGNE — codification EDD
    checks:
    - type: in_list
      severity: HIGH
      allowed_values:
      - D
      - M
      - P
      - R
      - S
      alert_threshold: 1.0
      control_type: BASIC
  consistency_rules:
  - name: pk_composite_complete
    description: PK composite (3 colonnes) toutes non-nulles
    condition: 1=1
    required_fields: *id017
    severity: CRITICAL
    alert_threshold: 0.0
    control_type: BASIC

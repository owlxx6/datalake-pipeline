- name: TYPOLOGIE
  domain: typologie
  primary_key:
  - IDF_NUM_TIERS
  is_partitioned: false
  source:
    path_template: hdfs://ubuntu3:9000/data/landing/{table_name_lower}/date_arrete={date_arrete}
    format: parquet
    loading:
      mode: FULL
  schema:
    on_cast_error: reject
    fields:
    - name: IDF_NUM_TIERS
      spark_type: StringType
      nullable: false
      description: Numéro de tiers
    - name: COD_MARCHE
      spark_type: StringType
      nullable: true
      description: Code marché
    - name: COD_SS_MARCHE
      spark_type: StringType
      nullable: true
      description: Code sous marché
    - name: DATE_EFFET_MARCHE
      spark_type: TimestampType
      nullable: true
      description: Date effet marché
    - name: DATE_FIN_MARCHE
      spark_type: TimestampType
      nullable: true
      description: Date fin marché
    - name: COD_STN
      spark_type: StringType
      nullable: true
      description: Code Strate
    - name: COD_SS_STN
      spark_type: StringType
      nullable: true
      description: Code sous strate
    - name: DATE_EFFET_STN
      spark_type: TimestampType
      nullable: true
      description: Date effet Strate
    - name: DATE_FIN_STN
      spark_type: TimestampType
      nullable: true
      description: Date fin Strate
    - name: COD_INDIC_ACTIV
      spark_type: StringType
      nullable: true
      description: Code indicateur activité
    - name: COD_INDIC_SS_ACTIV
      spark_type: StringType
      nullable: true
      description: Code indicateur sous activité
    - name: DATE_EFFET_INDIC_ACTIV
      spark_type: TimestampType
      nullable: true
      description: Date effet indicateur activité
    - name: DATE_FIN_INDIC_ACTIV
      spark_type: TimestampType
      nullable: true
      description: Date fin indicateur activité
  write:
    format: parquet
    path_template: hdfs://ubuntu3:9000/data/bronze/{domain}/{table_name}/date_arrete={date_arrete}
    mode: overwrite
    partition_by:
    - date_arrete
    compression: snappy
    coalesce: 4
  silver_write:
    database: silver_credit_garantie
    table: typologie
    mode: overwrite
    partition_by:
    - date_arrete
    deduplicate: true
  quality_rules:
  - field: IDF_NUM_TIERS
    source_column: IDF_NUM_TIERS
    data_type: StringType
    description: PK IDF_NUM_TIERS — clé primaire
    checks:
    - type: not_null
      severity: CRITICAL
      alert_threshold: 0.0
      control_type: BASIC
    - type: unique
      severity: CRITICAL
      alert_threshold: 0.0
      control_type: BASIC
  - field: COD_INDIC_ACTIV
    source_column: COD_INDIC_ACTIV
    data_type: StringType
    description: COD_INDIC_ACTIV — codification EDD
    checks:
    - type: not_null   # flag 'manquant' — distinct du in_list (ajouté 2026-05-31)
      severity: MEDIUM
      alert_threshold: 0.0
      control_type: BASIC
      informational: true   # systématique sur colonne optionnelle → hors statut ligne
    - type: in_list
      severity: HIGH
      allowed_values:
      - A0
      - A1
      - A2
      - A3
      - A4
      - A5
      - A6
      - IE5
      alert_threshold: 1.0
      control_type: BASIC
  - field: COD_MARCHE
    source_column: COD_MARCHE
    data_type: StringType
    description: COD_MARCHE — codification EDD
    checks:
    - type: not_null   # flag 'manquant' — distinct du in_list (ajouté 2026-05-31)
      severity: MEDIUM
      alert_threshold: 0.0
      control_type: BASIC
      informational: true   # systématique sur colonne optionnelle → hors statut ligne
    - type: in_list
      severity: HIGH
      allowed_values:
      - G
      - M
      - N
      - R
      - S
      - T
      - U
      - V
      - X
      alert_threshold: 1.0
      control_type: BASIC
  - field: COD_STN
    source_column: COD_STN
    data_type: StringType
    description: COD_STN — codification EDD
    checks:
    - type: not_null   # flag 'manquant' — distinct du in_list (ajouté 2026-05-31)
      severity: MEDIUM
      alert_threshold: 0.0
      control_type: BASIC
      informational: true   # systématique sur colonne optionnelle → hors statut ligne
    - type: in_list
      severity: HIGH
      allowed_values:
      - NS
      - SP
      - S0
      - S1
      - S2
      - S3
      - S4
      - S5
      alert_threshold: 1.0
      control_type: BASIC
